<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Staff Login · Premium Living Management System</title>
    <link rel="stylesheet" href="../CSS/staffStyle.css">
    <style>
        .demo-hint {
            background: #e9ecef;
            padding: 10px;
            border-radius: 8px;
            margin-top: 15px;
            font-size: 13px;
            text-align: center;
            color: #495057;
        }
        .background_img{
            background-image: url(../img/background.png);
            background-size: cover;    
            background-position: center; 
            background-repeat: no-repeat; 
            background-attachment: fixed; 
        }
    </style>
</head>
<body class="background_img">
    <div class="login">
        <h2> Staff Login Portal</h2>
        <form id="loginForm">
            <div class="item">
                <label>Email-Address</label>
                <input type="email" id="email" required>
            </div>
            <div class="item">
                <label>Password</label>
                <input type="password" id="password" placeholder="Any password (demo) "required>
            </div>
            <button type="submit">Login</button>
        </form>
        <div id="tip" style="color:red; margin-top: 12px;"></div>
        <div class="demo-hint">
             Demo: No real account required, any email/password works.<br>
            After login you will enter the staff dashboard (Products, Materials, Orders)
        </div>
        <button class="back-home-btn" onclick="window.location.href='../index.html'">Return to homepage</button>  
    </div>
    
    <script>
        const loginForm = document.getElementById('loginForm');
        const tipDiv = document.getElementById('tip');

        loginForm.addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            if (email === '' || password === '') {
                tipDiv.textContent = ' Please enter username and password (any value is fine)';
                return;
            }

            sessionStorage.setItem('staffLoggedIn', 'true');
            sessionStorage.setItem('staffName', email);

            window.location.href = 'staff_dashboard.html';
        });
    </script>
</body>
</html>
