<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Shopping Cart</title>
    <link rel="stylesheet" href="../CSS/style.css">

</head>
<body>

    <div class="nav">
        <a onclick="productPage()">Browse products</a>
        <a class="active" onclick="cartPage()">shopping cart</a>
        <a onclick="orderPage()">My Orders</a>
        <a onclick="AccountPage()">My account</a>
        <a onclick="logout()">Logout</a>
    </div>


    <div class="cart-container">
        <div class="cart-header">My Shopping Cart</div>
        
        <table class="cart-table">
            <thead>
                <tr>
                    <th>Product Name</th>
                    <th>Customization Info</th>
                    <th>Unit Price (CNY)</th>
                    <th>Quantity</th>
                    <th>Subtotal (CNY)</th>
                    <th>Operation</th>
                </tr>
            </thead>
            <tbody id="cartBody">
                <tr>
                    <td>Solid Wood Sofa</td>
                    <td>Oak, Linen Fabric, Two-seater</td>
                    <td>2899</td>
                    <td>1</td>
                    <td>2899</td>
                    <td><button class="cancel-btn" onclick="removeCartItem(this)">Cancel</button></td>
                </tr>
                <tr>
                    <td>Scandinavian Dining Table</td>
                    <td>None</td>
                    <td>1299</td>
                    <td>2</td>
                    <td>2598</td>
                    <td><button class="cancel-btn" onclick="removeCartItem(this)">Cancel</button></td>
                </tr>
                <tr>
                    <td>TV Cabinet</td>
                    <td>None</td>
                    <td>899</td>
                    <td>1</td>
                    <td>899</td>
                    <td><button class="cancel-btn" onclick="removeCartItem(this)">Cancel</button></td>
                </tr>
            </tbody>
        </table>

        <button class="submit-btn" onclick="submitCart()">Place Order</button>
    </div>

    <script>

        function removeCartItem(btn) {
            if (confirm('Are you sure to cancel this product?')) {
                const row = btn.closest('tr');
                row.remove();
            }
        }


        function submitCart() {
            const cartBody = document.getElementById('cartBody');
            if (cartBody.children.length === 0 || cartBody.querySelector('.empty-tip')) {
                alert('Shopping cart is empty, cannot place order!');
                return;
            }
            alert('Order submitted successfully! (Demo only)');

            cartBody.innerHTML = '<tr><td colspan="6" class="empty-tip">Shopping cart is empty</td></tr>';
        }


        function logout() {
            if (confirm('Are you sure to log out?')) {
                alert('Logged out successfully! Redirecting to login page shortly');
                window.location.href = 'customerLogin.html';
            }
        }

        function productPage(){
            window.location.href = 'prodecuList.html';
        }

        function AccountPage(){
            window.location.href = 'myAccount.html';
        }

        function orderPage(){
            window.location.href = 'order.html';
        }

        function cartPage(){
            window.location.href = 'cart.html'; 
        }
    </script>
</body>
</html>
