<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Furniture Product Browse</title>
    <link rel="stylesheet" href="../CSS/style.css">

</head>
<body>
    <div class="nav">
        <a class="active" onclick="productPage()">Browse products</a>
        <a onclick="cartPage()">shopping cart</a>
        <a onclick="orderPage()">My Orders</a>
        <a onclick="AccountPage()">My account</a>
        <a onclick="logout()">Logout</a>
    </div>

    <div class="header">
        <h1>Furniture Product Browse</h1>
    </div>

    <div class="sort-controls">
        <button class="sort-btn" onclick="sortGoods('name')">Sort by Name</button>
        <button class="sort-btn" onclick="sortGoods('stock')">Sort by Stock</button>
        <button class="sort-btn" onclick="sortGoods('price')">Sort by Price</button>
    </div>

    <div class="goods-box" id="goodsContainer">

        <div class="card" data-name="Sofa" data-stock="8" data-price="2899">
            <img src="../img/sofa.png" alt="Sofa" class="card-img"></img>
            <div class="card-info">
                <div class="card-name">Sofa</div>
                <div class="card-price">¥2899</div>
                <div class="stock">Stock: 8</div>
                <button class="card-btn" data-stock="8" onclick="viewProductInfo('Sofa')">Product Info</button>
            </div>
        </div>

        <div class="card" data-name="Dining Table" data-stock="15" data-price="1299">
            <img src="../img/table.png" alt="Dining Table" class="card-img"></img>
            <div class="card-info">
                <div class="card-name">Dining Table</div>
                <div class="card-price">¥1299</div>
                <div class="stock">Stock: 15</div>
                <button class="card-btn" data-stock="15" onclick="viewProductInfo('Dining Table')">Product Info</button>
            </div>
        </div>

        <div class="card" data-name="Bed" data-stock="0" data-price="1899">
            <img src="../img/Bed.png" alt="Bed" class="card-img"></img>
            <div class="card-info">
                <div class="card-name">Bed</div>
                <div class="card-price">¥1899</div>
                <div class="stock stock-out">Stock: 0</div>
                <button class="card-btn" data-stock="0" onclick="viewProductInfo('Bed')" disabled>Out of Stock</button>
            </div>
        </div>

        <div class="card" data-name="Wardrobe" data-stock="5" data-price="3299">
            <img src="../img/Wardrobe.png" alt="Wardrobe" class="card-img"></img>
            <div class="card-info">
                <div class="card-name">Wardrobe</div>
                <div class="card-price">¥3299</div>
                <div class="stock">Stock: 5</div>
                <button class="card-btn" data-stock="5" onclick="viewProductInfo('Wardrobe')">Product Info</button>
            </div>
        </div>

        <div class="card" data-name="Bookshelf" data-stock="12" data-price="999">
            <img src="../img/bookshelf.png" alt="Bookshelf" class="card-img"></img>
            <div class="card-info">
                <div class="card-name">Bookshelf</div>
                <div class="card-price">¥999</div>
                <div class="stock">Stock: 12</div>
                <button class="card-btn" data-stock="12" onclick="viewProductInfo('Bookshelf')">Product Info</button>
            </div>
        </div>

        <div class="card" data-name="Leisure Chair" data-stock="20" data-price="699">
            <img src="../img/Chair.png" alt="Leisure Chair" class="card-img"></img>
            <div class="card-info">
                <div class="card-name">Leisure Chair</div>
                <div class="card-price">¥699</div>
                <div class="stock">Stock: 20</div>
                <button class="card-btn" data-stock="20" onclick="viewProductInfo('Leisure Chair')">Product Info</button>
            </div>
        </div>

        <div class="card" data-name="Dressing Table" data-stock="25" data-price="399">
            <img src="../img/dressing table.jpg" alt="Dressing Table" class="card-img"></img>
            <div class="card-info">
                <div class="card-name">Dressing Table</div>
                <div class="card-price">¥399</div>
                <div class="stock">Stock: 25</div>
                <button class="card-btn" data-stock="25" onclick="viewProductInfo('Dressing Table')">Product Info</button>
            </div>
        </div>

        <div class="card" data-name="File Cabinet" data-stock="18" data-price="899">
            <img src="../img/Filing cabinet.png" alt="File Cabinet" class="card-img"></img>
            <div class="card-info">
                <div class="card-name">File Cabinet</div>
                <div class="card-price">¥899</div>
                <div class="stock">Stock: 18</div>
                <button class="card-btn" data-stock="18" onclick="viewProductInfo('File Cabinet')">Product Info</button>
            </div>
        </div>
        
    </div>

<script>

    let sortState = {
        name: 'asc',
        stock: 'asc',
        price: 'asc'
    };

    window.onload = function() {
        checkStockStatus();
    };

    function checkStockStatus() {
        const allButtons = document.querySelectorAll('.card-btn');
        allButtons.forEach(btn => {
            const stock = parseInt(btn.dataset.stock);

            if (stock < 1) {
                btn.disabled = true;
                btn.textContent = 'Out of Stock';

                const stockElement = btn.closest('.card-info').querySelector('.stock');
                stockElement.classList.add('stock-out');
            } else {
                btn.disabled = false;
                btn.textContent = 'Product Info';
            }
        });
    }

    function viewProductInfo(productName) {
        const btn = event.target;
        const stock = parseInt(btn.dataset.stock);
        window.location.href = 'furnitureInfo.html';
    }

    function sortGoods(type) {
        const container = document.getElementById('goodsContainer');
        const cards = Array.from(container.querySelectorAll('.card'));

        cards.sort((a, b) => {
            let valA, valB;
            switch (type) {
                case 'name':
                    valA = a.dataset.name;
                    valB = b.dataset.name;
                    return sortState[type] === 'asc' 
                        ? valA.localeCompare(valB, 'en-US') 
                        : valB.localeCompare(valA, 'en-US');
                case 'stock':
                    valA = parseInt(a.dataset.stock);
                    valB = parseInt(b.dataset.stock);
                    return sortState[type] === 'asc' ? valA - valB : valB - valA;
                case 'price':
                    valA = parseInt(a.dataset.price);
                    valB = parseInt(b.dataset.price);
                    return sortState[type] === 'asc' ? valA - valB : valB - valA;
            }
        });

        sortState[type] = sortState[type] === 'asc' ? 'desc' : 'asc';

        container.innerHTML = '';
        cards.forEach(card => container.appendChild(card));

        checkStockStatus();
    }

    function logout() {
        if (confirm('Are you sure to log out?')) {
            alert('Logout successful! Redirecting to login page');
            window.location.href = 'customerLogin.html';
        }
    }

    function productPage(){
        window.location.href = 'prodecuList.html';
    }

    function AccountPage(){
        window.location.href = 'myAccount.html';
    }

    function orderPage(){
        window.location.href = 'order.html';
    }

    function cartPage(){
        window.location.href = 'cart.html'; 
    }
</script>
</body>
</html>
